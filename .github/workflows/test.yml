name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cyhu:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest tests.test_cyhu -v
      - name: Catalog and themes
        run: python tools/cyhu.py catalog validate
      - name: Demo run
        run: python tools/cyhu.py --demo tests/fixtures/fyt-android10-1280x720.json --records ${{ runner.temp }}/rec status
